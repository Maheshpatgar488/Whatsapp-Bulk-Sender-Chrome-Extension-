name: WhatsApp Web Canary Monitor

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:     # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  canary-check:
    name: WhatsApp Web Release & Selector Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Canary Check
        run: node scripts/canary.js

      - name: Commit build record updates if version changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/last_whatsapp_build.json || true
          if git diff --staged --quiet; then
            echo "No WhatsApp Web release change detected."
          else
            git commit -m "chore(canary): update WhatsApp Web build signature [skip ci]"
            git push
          fi
